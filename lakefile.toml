name = "lean-learning"
version = "0.1.0"
defaultTargets = ["ReintroductionToProofs", "RealAnalysisGame"]
srcDir = "src"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.1"

[[lean_lib]]
name = "MultiProof"

[[lean_lib]]
name = "ReintroductionToProofs"
globs = ["ReintroductionToProofs", "ReintroductionToProofs.+"]

[[lean_lib]]
name = "RealAnalysisGame"
globs = ["RealAnalysisGame", "RealAnalysisGame.+"]
